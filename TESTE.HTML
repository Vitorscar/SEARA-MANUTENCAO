<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Painel de Parada — Manutenção</title>
<style>
:root{
  --bg:#0B0F14;
  --panel:#121821;
  --panel-2:#182130;
  --border:#26313F;
  --text:#E7ECF2;
  --muted:#8B98A8;
  --muted-2:#5C6B7C;
  --red:#E5484D;
  --red-dim:#3A1E20;
  --amber:#EFA93B;
  --amber-dim:#3A2E14;
  --green:#3FB966;
  --green-dim:#12261B;
  --blue:#4C8DFF;
  --blue-dim:#132239;
  --radius:10px;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- Shell ---------- */
#app{display:flex; min-height:100vh;}

/* Sidebar (desktop) */
#sidebar{
  display:none;
  width:220px; flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:20px 14px;
  flex-direction:column;
  gap:4px;
}
#sidebar .brand{
  font-size:13px; letter-spacing:.02em; color:var(--muted);
  padding:0 10px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;
}
#sidebar .brand b{color:var(--text); display:block; font-size:16px; margin-bottom:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:8px; border:none; background:transparent;
  color:var(--muted); text-align:left; font-size:14px; width:100%;
}
.nav-item:hover{background:var(--panel-2); color:var(--text);}
.nav-item.active{background:var(--blue-dim); color:var(--blue);}
.nav-item svg{width:18px; height:18px; flex-shrink:0;}

/* Main column */
#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky; top:0; z-index:5;
}
#topbar .greet{font-size:15px;}
#topbar .greet .time{color:var(--muted); font-family:var(--mono); font-size:12px; display:block;}
#clock{font-family:var(--mono); color:var(--muted); font-size:13px;}

#view{flex:1; padding:14px; padding-bottom:90px; max-width:1200px; width:100%; margin:0 auto;}

/* Bottom nav (mobile) */
#bottomnav{
  position:fixed; bottom:0; left:0; right:0;
  display:flex; background:var(--panel);
  border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:10;
}
#bottomnav .nav-item{flex-direction:column; gap:2px; font-size:10px; align-items:center; padding:6px 2px;}
#bottomnav .nav-item svg{width:20px; height:20px;}

@media (min-width:860px){
  #sidebar{display:flex;}
  #bottomnav{display:none;}
  #view{padding:22px 28px;}
}

/* ---------- Status chips ---------- */
.status-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.chip{
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--panel);
  font-size:13px; flex:1; min-width:140px;
}
.chip .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.chip b{font-family:var(--mono); font-size:16px; display:block;}
.chip .lbl{color:var(--muted); font-size:11px;}
.dot.red{background:var(--red); box-shadow:0 0 0 4px var(--red-dim);}
.dot.amber{background:var(--amber); box-shadow:0 0 0 4px var(--amber-dim);}
.dot.green{background:var(--green); box-shadow:0 0 0 4px var(--green-dim);}
.dot.blue{background:var(--blue); box-shadow:0 0 0 4px var(--blue-dim);}

/* ---------- Section headers ---------- */
.section-head{
  display:flex; align-items:center; justify-content:space-between;
  margin:22px 0 10px;
}
.section-head h2{font-size:13px; color:var(--muted); font-weight:600;}
.section-head .action{color:var(--blue); background:none; border:none; font-size:12px;}

/* ---------- Parada cards ---------- */
.parada-card{
  background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--muted-2);
  border-radius:var(--radius); padding:14px; margin-bottom:10px;
}
.parada-card.crit{border-left-color:var(--red); background:linear-gradient(180deg, var(--red-dim) 0%, var(--panel) 60px);}
.parada-card.warn{border-left-color:var(--amber);}
.parada-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.parada-card .maquina{font-size:15px; font-weight:600;}
.parada-card .linha{color:var(--muted); font-size:12px;}
.parada-card .tempo{font-family:var(--mono); font-size:13px; text-align:right;}
.parada-card .tempo .lbl{display:block; font-size:10px; color:var(--muted); font-weight:400;}
.parada-card .meta{display:flex; gap:14px; margin-top:8px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
.parada-card .actions{display:flex; gap:8px; margin-top:12px;}

.btn{
  border-radius:8px; border:1px solid var(--border); background:var(--panel-2);
  color:var(--text); padding:9px 14px; font-size:13px; font-weight:500;
}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff;}
.btn.danger{background:var(--red); border-color:var(--red); color:#fff;}
.btn.ghost{background:transparent;}
.btn.block{width:100%;}
.btn.sm{padding:6px 10px; font-size:12px;}

.quick-actions{display:flex; gap:10px; margin-top:20px;}
.quick-actions .btn{flex:1; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px;}
.quick-actions .btn svg{width:20px; height:20px;}

/* ---------- Machine list ---------- */
.machine-grid{display:grid; grid-template-columns:1fr; gap:10px;}
@media (min-width:640px){.machine-grid{grid-template-columns:repeat(2,1fr);}}
@media (min-width:1000px){.machine-grid{grid-template-columns:repeat(3,1fr);}}
.machine-card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; display:flex; flex-direction:column; gap:8px;
}
.machine-card .row1{display:flex; justify-content:space-between; align-items:center;}
.machine-card .nome{font-weight:600; font-size:14px;}
.machine-card .linha{color:var(--muted); font-size:12px;}
.badge{font-size:10px; padding:3px 8px; border-radius:20px; font-weight:600; letter-spacing:.02em;}
.badge.ok{background:var(--green-dim); color:var(--green);}
.badge.parada{background:var(--red-dim); color:var(--red);}
.badge.p1{background:var(--red-dim); color:var(--red);}
.badge.p2{background:var(--amber-dim); color:var(--amber);}
.badge.p3{background:var(--panel-2); color:var(--muted);}

/* ---------- Kanban ---------- */
.kanban{display:grid; grid-template-columns:repeat(4,minmax(220px,1fr)); gap:12px; overflow-x:auto;}
@media (max-width:859px){.kanban{grid-auto-flow:column; grid-template-columns:none;}}
.kcol{background:var(--panel-2); border-radius:var(--radius); padding:10px; min-width:220px; min-height:120px;}
.kcol h3{font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between;}
.kcard{
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:10px; margin-bottom:8px; font-size:13px; cursor:grab;
}
.kcard .os-num{font-family:var(--mono); font-size:11px; color:var(--muted);}
.kcard.dragover{border-color:var(--blue);}
.kcol.dragover{outline:2px dashed var(--blue); outline-offset:-4px;}

/* ---------- Forms / modal ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
.field select, .field input, .field textarea{
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  padding:11px 12px; border-radius:8px; font-size:14px;
}
.field textarea{min-height:70px; resize:vertical;}
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
@media (min-width:640px){.overlay{align-items:center;}}
.sheet{
  background:var(--panel); border:1px solid var(--border); border-radius:16px 16px 0 0;
  width:100%; max-width:480px; padding:20px; max-height:88vh; overflow-y:auto;
}
@media (min-width:640px){.sheet{border-radius:16px;}}
.sheet h2{font-size:16px; margin-bottom:16px;}
.sheet .foot{display:flex; gap:10px; margin-top:6px;}
.close-x{position:absolute; top:14px; right:14px; background:none; border:none; color:var(--muted); font-size:20px;}

/* ---------- Reports ---------- */
.pareto-row{margin-bottom:14px;}
.pareto-row .plabel{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
.pareto-row .ptrack{height:10px; background:var(--panel-2); border-radius:5px; overflow:hidden;}
.pareto-row .pfill{height:100%; background:var(--blue); border-radius:5px;}
.kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;}
@media (min-width:640px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
.kpi b{font-family:var(--mono); font-size:22px; display:block;}
.kpi span{color:var(--muted); font-size:11px;}

/* ---------- Toast ---------- */
#toastwrap{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; width:min(340px,90vw);}
.toast{background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:slidein .2s ease;}
@keyframes slidein{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

.empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}
.hidden{display:none !important;}
</style>
</head>
<body>

<div id="toastwrap"></div>

<div id="app">
  <nav id="sidebar">
    <div class="brand"><b>Chão de Fábrica</b>Painel de Parada</div>
    <button class="nav-item" data-view="dashboard">📡 Dashboard</button>
    <button class="nav-item" data-view="maquinas">⚙️ Máquinas</button>
    <button class="nav-item" data-view="os">🗂️ Ordens de Serviço</button>
    <button class="nav-item" data-view="equipe">👥 Equipe</button>
    <button class="nav-item" data-view="relatorios">📊 Relatórios</button>
  </nav>

  <div id="main">
    <header id="topbar">
      <div class="greet" id="greetText">Bom dia, Carlos.<span class="time" id="greetSub"></span></div>
      <div id="clock"></div>
    </header>
    <main id="view"></main>
  </div>

  <nav id="bottomnav">
    <button class="nav-item" data-view="dashboard">📡<span>Radar</span></button>
    <button class="nav-item" data-view="maquinas">⚙️<span>Máquinas</span></button>
    <button class="nav-item" data-view="os">🗂️<span>OS</span></button>
    <button class="nav-item" data-view="equipe">👥<span>Equipe</span></button>
    <button class="nav-item" data-view="relatorios">📊<span>Relatórios</span></button>
  </nav>
</div>

<div id="modalRoot"></div>

<script>
/* =========================================================
   ESTADO E PERSISTÊNCIA (localStorage — trocar por Supabase
   depois: ver services/*.service.js na doc original)
   ========================================================= */
const DB_KEY = 'paradas_app_v1';

function seed(){
  const now = Date.now();
  return {
    maquinas: [
      {id:'m1', nome:'Prensa 02', linha:'Linha 03', prioridade:1, status:'parada', categoria:'Mecânica'},
      {id:'m2', nome:'Esteira 04', linha:'Linha 01', prioridade:2, status:'parada', categoria:'Elétrica'},
      {id:'m3', nome:'Injetora 07', linha:'Linha 02', prioridade:1, status:'ok', categoria:'Mecânica'},
      {id:'m4', nome:'Torno CNC 11', linha:'Linha 04', prioridade:2, status:'ok', categoria:'Mecânica'},
      {id:'m5', nome:'Compressor 01', linha:'Utilidades', prioridade:1, status:'ok', categoria:'Elétrica'},
      {id:'m6', nome:'Seladora 09', linha:'Linha 02', prioridade:3, status:'ok', categoria:'Mecânica'},
    ],
    tecnicos: [
      {id:'t1', nome:'João', especialidade:'Mecânica'},
      {id:'t2', nome:'Carla', especialidade:'Elétrica'},
      {id:'t3', nome:'Marcos', especialidade:'Mecânica'},
    ],
    paradas: [
      {id:'p1', maquinaId:'m1', motivo:'Vazamento hidráulico', categoria:'Falha Mecânica',
       inicio: now - 48*60000, fim:null, status:'aberta', tecnicoId:null},
      {id:'p2', maquinaId:'m2', motivo:'Sensor de posição com falha', categoria:'Elétrica',
       inicio: now - 15*60000, fim:null, status:'atendimento', tecnicoId:'t1'},
    ],
    os: [
      {id:'os1', paradaId:'p1', maquinaId:'m1', titulo:'Vazamento hidráulico', coluna:'fila', tecnicoId:null},
      {id:'os2', paradaId:'p2', maquinaId:'m2', titulo:'Sensor de posição', coluna:'andamento', tecnicoId:'t1'},
      {id:'os3', maquinaId:'m3', titulo:'Troca de óleo preventiva', coluna:'fila', tecnicoId:null},
      {id:'os4', maquinaId:'m6', titulo:'Limpeza geral', coluna:'concluido', tecnicoId:'t3'},
    ],
    historico: [ // paradas encerradas dos últimos 30 dias, pra alimentar relatórios
      {categoria:'Falha Mecânica', minutos:620},
      {categoria:'Falha Mecânica', minutos:340},
      {categoria:'Falta de Material', minutos:410},
      {categoria:'Erro Operacional', minutos:180},
      {categoria:'Elétrica', minutos:150},
      {categoria:'Falha Mecânica', minutos:260},
    ]
  };
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const s = seed();
  saveDB(s);
  return s;
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

let db = loadDB();

/* =========================================================
   HELPERS
   ========================================================= */
function fmtMin(ms){
  const min = Math.floor(ms/60000);
  const h = Math.floor(min/60), m = min%60;
  return h>0 ? `${h}h ${m}min` : `${m} min`;
}
function nowStr(){
  const d = new Date();
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toastwrap').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function maquina(id){ return db.maquinas.find(m=>m.id===id); }
function tecnico(id){ return db.tecnicos.find(t=>t.id===id); }
function paradasAbertas(){ return db.paradas.filter(p=>p.status!=='encerrada'); }

/* Matriz de escalonamento: 30min amarelo, 60min vermelho */
function nivelAlerta(p){
  const decorridos = Date.now()-p.inicio;
  if(decorridos >= 60*60000) return 'crit';
  if(decorridos >= 30*60000) return 'warn';
  return 'ok';
}

/* =========================================================
   ROTEAMENTO
   ========================================================= */
const routes = {
  dashboard: renderDashboard,
  maquinas: renderMaquinas,
  os: renderOS,
  equipe: renderEquipe,
  relatorios: renderRelatorios,
};
let currentView = 'dashboard';

function navigate(view){
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  document.getElementById('view').innerHTML = '';
  routes[view]();
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav-item').forEach(b=>{
  b.addEventListener('click', ()=>navigate(b.dataset.view));
});

/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboard(){
  const abertas = paradasAbertas();
  const criticas = abertas.filter(p=>nivelAlerta(p)==='crit');
  const atendimento = abertas.filter(p=>p.status==='atendimento');
  const tempoHojeMs = abertas.reduce((s,p)=>s+(Date.now()-p.inicio),0);

  const html = `
    <div class="status-row">
      <div class="chip"><span class="dot red"></span><div><b>${criticas.length}</b><span class="lbl">paradas críticas</span></div></div>
      <div class="chip"><span class="dot amber"></span><div><b>${atendimento.length}</b><span class="lbl">em atendimento</span></div></div>
      <div class="chip"><span class="dot blue"></span><div><b>${fmtMin(tempoHojeMs)}</b><span class="lbl">tempo perdido hoje</span></div></div>
    </div>

    <div class="section-head"><h2>ATENÇÃO IMEDIATA</h2></div>
    <div id="listaAbertas"></div>

    <div class="quick-actions">
      <button class="btn primary" id="btnRegistrarParada">🚨<span>Registrar Parada</span></button>
      <button class="btn" id="btnRelatorioRapido">📊<span>Relatório Rápido</span></button>
    </div>
  `;
  document.getElementById('view').innerHTML = html;

  const lista = document.getElementById('listaAbertas');
  if(abertas.length===0){
    lista.innerHTML = `<div class="empty">Nenhuma parada em aberto. Fábrica rodando limpa. ✅</div>`;
  } else {
    // críticas primeiro
    const ordenadas = [...abertas].sort((a,b)=>a.inicio-b.inicio);
    lista.innerHTML = ordenadas.map(p=>paradaCardHTML(p)).join('');
  }

  document.getElementById('btnRegistrarParada').onclick = ()=>openRegistrarParada();
  document.getElementById('btnRelatorioRapido').onclick = ()=>navigate('relatorios');

  bindParadaCardActions();
}

function paradaCardHTML(p){
  const m = maquina(p.maquinaId);
  const nivel = nivelAlerta(p);
  const t = tecnico(p.tecnicoId);
  const cls = nivel==='crit' ? 'crit' : nivel==='warn' ? 'warn' : '';
  const statusLbl = p.status==='atendimento' ? `Em atendimento${t? ' · '+t.nome:''}` : 'Aguardando técnico';
  return `
    <div class="parada-card ${cls}" data-id="${p.id}">
      <div class="top">
        <div>
          <div class="maquina">${nivel==='crit'?'🔴':nivel==='warn'?'🟡':'🟢'} ${m.nome}</div>
          <div class="linha">${m.linha} · ${p.motivo}</div>
        </div>
        <div class="tempo"><span class="lbl">parada há</span>${fmtMin(Date.now()-p.inicio)}</div>
      </div>
      <div class="meta">
        <span>${statusLbl}</span>
        <span>Prioridade P${m.prioridade}</span>
      </div>
      <div class="actions">
        ${p.status==='aberta' ? `<button class="btn sm primary" data-act="atender" data-id="${p.id}">Iniciar atendimento</button>` : ''}
        ${p.status==='atendimento' ? `<button class="btn sm primary" data-act="encerrar" data-id="${p.id}">Encerrar</button>` : ''}
        <button class="btn sm ghost" data-act="cobrar" data-id="${p.id}">Cobrar</button>
        ${nivel==='crit' ? `<button class="btn sm danger" data-act="escalar" data-id="${p.id}">Escalar</button>`: ''}
      </div>
    </div>
  `;
}

function bindParadaCardActions(){
  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const p = db.paradas.find(x=>x.id===id);
      if(act==='atender') openAtendimento(p);
      if(act==='encerrar') openEncerramento(p);
      if(act==='cobrar') toast('Notificação enviada ao técnico responsável.');
      if(act==='escalar') { toast('Gestor notificado sobre a parada crítica.'); }
    };
  });
}

/* ---------- Modal: Registrar parada ---------- */
function openRegistrarParada(){
  const disponiveis = db.maquinas.filter(m=>m.status==='ok');
  const opts = disponiveis.map(m=>`<option value="${m.id}">${m.nome} — ${m.linha}</option>`).join('');
  const html = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>Registrar Parada</h2>
        <div class="field">
          <label>Máquina</label>
          <select id="fMaquina">${opts || '<option disabled>Nenhuma máquina disponível</option>'}</select>
        </div>
        <div class="field">
          <label>Categoria</label>
          <select id="fCategoria">
            <option>Falha Mecânica</option>
            <option>Elétrica</option>
            <option>Falta de Material</option>
            <option>Erro Operacional</option>
          </select>
        </div>
        <div class="field">
          <label>Motivo</label>
          <textarea id="fMotivo" placeholder="Ex: Vazamento hidráulico na bomba principal"></textarea>
        </div>
        <div class="foot">
          <button class="btn block ghost" id="cancelar">Cancelar</button>
          <button class="btn block primary" id="confirmar">Abrir Parada</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('cancelar').onclick = closeModal;
  document.getElementById('confirmar').onclick = ()=>{
    const maquinaId = document.getElementById('fMaquina').value;
    const categoria = document.getElementById('fCategoria').value;
    const motivo = document.getElementById('fMotivo').value.trim() || categoria;
    if(!maquinaId){ toast('Selecione uma máquina.'); return; }
    const id = 'p'+Date.now();
    db.paradas.push({id, maquinaId, motivo, categoria, inicio:Date.now(), fim:null, status:'aberta', tecnicoId:null});
    db.os.push({id:'os'+Date.now(), paradaId:id, maquinaId, titulo:motivo, coluna:'fila', tecnicoId:null});
    maquina(maquinaId).status = 'parada';
    saveDB(db);
    closeModal();
    toast('Parada registrada. OS aberta no quadro.');
    navigate(currentView);
  };
}

/* ---------- Modal: Iniciar atendimento ---------- */
function openAtendimento(p){
  const m = maquina(p.maquinaId);
  const opts = db.tecnicos.map(t=>`<option value="${t.id}">${t.nome} — ${t.especialidade}</option>`).join('');
  const html = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>Iniciar Atendimento — ${m.nome}</h2>
        <div class="field">
          <label>Técnico responsável</label>
          <select id="fTecnico">${opts}</select>
        </div>
        <div class="foot">
          <button class="btn block ghost" id="cancelar">Cancelar</button>
          <button class="btn block primary" id="confirmar">Confirmar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('cancelar').onclick = closeModal;
  document.getElementById('confirmar').onclick = ()=>{
    const tecnicoId = document.getElementById('fTecnico').value;
    p.status = 'atendimento';
    p.tecnicoId = tecnicoId;
    const os = db.os.find(o=>o.paradaId===p.id);
    if(os){ os.coluna='andamento'; os.tecnicoId = tecnicoId; }
    saveDB(db);
    closeModal();
    toast('Atendimento iniciado.');
    navigate(currentView);
  };
}

/* ---------- Modal: Encerrar parada ---------- */
function openEncerramento(p){
  const m = maquina(p.maquinaId);
  const mttr = fmtMin(Date.now()-p.inicio);
  const html = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>Encerrar Parada — ${m.nome}</h2>
        <div class="field">
          <label>Causa raiz confirmada</label>
          <textarea id="fCausa" placeholder="Ex: mangueira rompida por desgaste; recomendado revisar pressão da bomba">${p.motivo}</textarea>
        </div>
        <div class="field">
          <label>MTTR calculado</label>
          <input value="${mttr}" disabled>
        </div>
        <div class="foot">
          <button class="btn block ghost" id="cancelar">Cancelar</button>
          <button class="btn block primary" id="confirmar">Confirmar volta de operação</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('cancelar').onclick = closeModal;
  document.getElementById('confirmar').onclick = ()=>{
    p.status = 'encerrada';
    p.fim = Date.now();
    m.status = 'ok';
    const os = db.os.find(o=>o.paradaId===p.id);
    if(os) os.coluna = 'concluido';
    db.historico.push({categoria:p.categoria||'Falha Mecânica', minutos: Math.floor((p.fim-p.inicio)/60000)});
    saveDB(db);
    closeModal();
    toast(`${m.nome} voltou a operar. MTTR: ${mttr}.`);
    navigate(currentView);
  };
}

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* =========================================================
   MÁQUINAS
   ========================================================= */
function renderMaquinas(){
  const html = `
    <div class="section-head"><h2>MÁQUINAS</h2>
      <button class="action" id="btnNovaParada">+ Registrar parada</button>
    </div>
    <div class="machine-grid" id="grid"></div>
  `;
  document.getElementById('view').innerHTML = html;
  document.getElementById('grid').innerHTML = db.maquinas.map(m=>{
    const parada = db.paradas.find(p=>p.maquinaId===m.id && p.status!=='encerrada');
    return `
      <div class="machine-card">
        <div class="row1">
          <div>
            <div class="nome">${m.nome}</div>
            <div class="linha">${m.linha}</div>
          </div>
          <span class="badge ${m.status==='ok'?'ok':'parada'}">${m.status==='ok'?'OPERANDO':'PARADA'}</span>
        </div>
        <div class="linha">${m.categoria} · <span class="badge p${m.prioridade}">P${m.prioridade}</span></div>
        ${parada ? `<div class="linha">Parada há ${fmtMin(Date.now()-parada.inicio)} — ${parada.motivo}</div>` : ''}
      </div>
    `;
  }).join('');
  document.getElementById('btnNovaParada').onclick = ()=>openRegistrarParada();
}

/* =========================================================
   ORDENS DE SERVIÇO — KANBAN
   ========================================================= */
const colunas = [
  {id:'fila', nome:'A Fazer'},
  {id:'andamento', nome:'Em Andamento'},
  {id:'aguardando', nome:'Aguardando'},
  {id:'concluido', nome:'Concluído'},
];

function renderOS(){
  const html = `
    <div class="section-head"><h2>ORDENS DE SERVIÇO</h2></div>
    <div class="kanban" id="kanban"></div>
  `;
  document.getElementById('view').innerHTML = html;
  const kanban = document.getElementById('kanban');
  kanban.innerHTML = colunas.map(c=>{
    const items = db.os.filter(o=>o.coluna===c.id);
    return `
      <div class="kcol" data-col="${c.id}">
        <h3><span>${c.nome}</span><span>${items.length}</span></h3>
        <div class="kcol-body">
          ${items.map(o=>{
            const m = maquina(o.maquinaId);
            const t = tecnico(o.tecnicoId);
            return `
              <div class="kcard" draggable="true" data-id="${o.id}">
                <div class="os-num">#${o.id}</div>
                <div>${o.titulo}</div>
                <div class="linha">${m? m.nome:''}${t? ' · '+t.nome:''}</div>
              </div>
            `;
          }).join('') || '<div class="empty">vazio</div>'}
        </div>
      </div>
    `;
  }).join('');

  // drag and drop
  let draggedId = null;
  kanban.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{ draggedId = card.dataset.id; e.dataTransfer.effectAllowed='move'; });
  });
  kanban.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', e=>{
      e.preventDefault();
      col.classList.remove('dragover');
      const os = db.os.find(o=>o.id===draggedId);
      if(os){
        os.coluna = col.dataset.col;
        // sincroniza status da parada vinculada
        const p = db.paradas.find(p=>p.id===os.paradaId);
        if(p){
          if(col.dataset.col==='andamento') p.status='atendimento';
          if(col.dataset.col==='concluido' && p.status!=='encerrada'){
            p.status='encerrada'; p.fim=Date.now();
            const m = maquina(p.maquinaId); if(m) m.status='ok';
          }
        }
        saveDB(db);
        navigate('os');
      }
    });
  });
}

/* =========================================================
   EQUIPE
   ========================================================= */
function renderEquipe(){
  const html = `
    <div class="section-head"><h2>EQUIPE</h2></div>
    <div class="machine-grid" id="eqGrid"></div>
  `;

        </div>

/* =========================================================
   RELATÓRIOS
   ========================================================= */
function renderRelatorios(){
  const encerradas = db.paradas.filter(p=>p.status==='encerrada');
  const totalMin = db.historico.reduce((s,h)=>s+h.minutos,0) + encerradas.reduce((s,p)=>s+Math.floor((p.fim-p.inicio)/60000),0);
  const mttrMedio = encerradas.length ? Math.floor(encerradas.reduce((s,p)=>s+(p.fim-p.inicio),0)/encerradas.length/60000) : '—';

  const porCategoria = {};
  db.historico.forEach(h=> porCategoria[h.categoria] = (porCategoria[h.categoria]||0) + h.minutos);
  encerradas.forEach(p=>{
    const cat = p.categoria || 'Falha Mecânica';
    porCategoria[cat] = (porCategoria[cat]||0) + Math.floor((p.fim-p.inicio)/60000);
  });
  const max = Math.max(...Object.values(porCategoria), 1);
  const ordenado = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]);

  const html = `
    <div class="section-head"><h2>RELATÓRIOS — ÚLTIMOS 30 DIAS</h2></div>
    <div class="kpi-grid">
      <div class="kpi"><b>${fmtMin(totalMin*60000)}</b><span>tempo total parado</span></div>
      <div class="kpi"><b>${mttrMedio}${mttrMedio!=='—'?' min':''}</b><span>MTTR médio</span></div>
      <div class="kpi"><b>${encerradas.length}</b><span>paradas encerradas</span></div>
      <div class="kpi"><b>${db.maquinas.filter(m=>m.status==='parada').length}</b><span>máquinas paradas agora</span></div>
    </div>

    <div class="section-head"><h2>CAUSAS DE PARADA (PARETO)</h2></div>
    <div id="pareto"></div>

    <div class="quick-actions">
      <button class="btn block primary" id="btnExportar">⬇️ Exportar PDF/Excel</button>
    </div>
  `;
  document.getElementById('view').innerHTML = html;
  document.getElementById('pareto').innerHTML = ordenado.map(([cat,min])=>{
    const pct = Math.round(min/max*100);
    return `
      <div class="pareto-row">
        <div class="plabel"><span>${cat}</span><span>${fmtMin(min*60000)}</span></div>
        <div class="ptrack"><div class="pfill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
  document.getElementById('btnExportar').onclick = ()=> toast('Exportação simulada — plugar services/relatorios.service.js aqui.');
}

/* =========================================================
   RELÓGIO E BOOT
   ========================================================= */
function tickClock(){
  document.getElementById('clock').textContent = nowStr();
  const h = new Date().getHours();
  const saud = h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  document.getElementById('greetText').innerHTML = `${saud}, Carlos.<span class="time" id="greetSub"></span>`;
}
setInterval(()=>{
  tickClock();
  if(currentView==='dashboard') renderDashboard(); // atualiza tempos e níveis de alerta
}, 30000);

tickClock();
navigate('dashboard');
</script>
